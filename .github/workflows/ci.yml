# Synced from the platform repo (templates/rust). Change it there, then sync.
name: CI

# Required check: "check". No paths filter: a required check that never runs
# leaves the PR unmergeable. Drafts skip the job, which counts as passing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml when there is one; install it up front.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
