[package]
name = "reeve-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The reeve benchmark: runs agents on fixed scenarios and scores what they chose"

[dependencies]
reeve = { path = "../.." }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27"
