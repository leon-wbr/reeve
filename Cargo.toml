[package]
name = "reeve"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
